  --live:#5CCFF5; --live-soft:rgba(92,207,245,.10); --live-line:rgba(92,207,245,.34);
  --ask:#F2B24C; --ask-soft:rgba(242,178,76,.10); --ask-line:rgba(242,178,76,.36);
  --bad:#F07A7A; --bad-soft:rgba(240,122,122,.10);
  --good:#4ADE96; --good-soft:rgba(74,222,150,.09);
  --add-bg:rgba(74,222,150,.08); --del-bg:rgba(240,122,122,.08);
  --btn:#ECEDEF; --btn-text:#0A0B0E;
  --spot:rgba(255,255,255,.055);
  --shadow:0 0 0 1px var(--line),var(--hi),0 16px 40px -20px rgba(0,0,0,.8);
  --shadow-pop:0 0 0 1px var(--line-2),var(--hi),0 28px 72px -18px rgba(0,0,0,.85);
  --ring:0 0 0 1px var(--live-line),0 0 0 5px rgba(92,207,245,.08);
  --scrim:rgba(4,5,7,.62);
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#EEEEEC; --panel:#F8F8F7; --raised:#FFFFFF; --raised-2:#F2F2F0; --sunken:#F2F2F0;
  --surface:linear-gradient(180deg,#FFFFFF,#FCFCFB);
  --line:rgba(17,18,22,.07); --line-2:rgba(17,18,22,.11); --line-3:rgba(17,18,22,.18);
  --hi:inset 0 1px 0 rgba(255,255,255,.9);
  --text:#16171A; --text-2:#5C6068; --text-3:#8A8E96;
  --live:#0A86B8; --live-soft:rgba(10,134,184,.08); --live-line:rgba(10,134,184,.32);
  --ask:#B56A00; --ask-soft:rgba(214,138,20,.10); --ask-line:rgba(181,106,0,.36);
  --bad:#CC3B3B; --bad-soft:rgba(204,59,59,.08);
  --good:#178A52; --good-soft:rgba(23,138,82,.08);
  --add-bg:rgba(23,138,82,.07); --del-bg:rgba(204,59,59,.06);
  --btn:#16171A; --btn-text:#FFFFFF;
  --spot:rgba(10,134,184,.05);
  --shadow:0 0 0 1px var(--line),0 1px 2px rgba(17,18,22,.04),0 10px 28px -14px rgba(17,18,22,.14);
  --shadow-pop:0 0 0 1px var(--line-2),0 28px 72px -18px rgba(17,18,22,.3);
  --ring:0 0 0 1px var(--live-line),0 0 0 5px rgba(10,134,184,.07);
  --scrim:rgba(238,238,236,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;font-feature-settings:"ss01","cv11"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;resize:none}
svg{width:16px;height:16px;flex:none;stroke-width:1.75}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:-.01em}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
:focus-visible{outline:2px solid var(--live);outline-offset:2px;border-radius:8px}
input:focus-visible,textarea:focus-visible{outline:none}
body.theming *{transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),color var(--t) var(--ease)!important}
kbd,.kbd{font-family:var(--mono);font-size:10.5px;color:var(--text-3);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 4px;line-height:15px;background:transparent;white-space:nowrap}
.sp{flex:1}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:300px 1fr;height:100vh}

/* Console: the left column is about the agent and your control over it, not page links. */
.con{display:flex;flex-direction:column;min-height:0;padding:14px 10px 10px 14px;gap:14px}
.con-h{display:flex;align-items:center;gap:10px;padding:2px 4px 0}
.con-h .mark{width:24px;height:24px}
.con-h b{font-weight:600;letter-spacing:-.01em;font-size:15px}
.state{margin-left:auto;display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--live-soft);color:var(--live);transition:all var(--t) var(--ease)}
.state i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:breathe 2.2s ease-in-out infinite}
.state.paused{background:var(--raised-2);color:var(--text-2)} .state.paused i{animation:none}
.state.ask{background:var(--ask-soft);color:var(--ask)}
@keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}

.pulse-box{padding:12px 12px 10px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow)}
.bars{display:flex;align-items:flex-end;gap:2px;height:30px}
.bars i{flex:1;border-radius:2px;background:var(--line-3);min-height:2px;transition:height .5s var(--ease-out),background .4s}
.bars i.on{background:var(--live)}
.bars i.ask{background:var(--ask)}
.pulse-box .cap{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px;color:var(--text-3)}
.pulse-box .cap b{color:var(--text-2);font-weight:500;font-family:var(--mono);font-size:11.5px}

.con-scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;margin-right:-4px;padding-right:4px}
.grp-h{display:flex;align-items:center;gap:8px;padding:0 6px 6px;font-size:11.5px;font-weight:500;color:var(--text-3);letter-spacing:.02em}
.grp-h .n{font-family:var(--mono)}
.grp-h .hint{margin-left:auto;font-weight:400;opacity:0;transition:opacity var(--t)}
.grp:hover .grp-h .hint{opacity:1}
.ti{position:relative;display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start;padding:8px 8px;border-radius:var(--r);cursor:pointer;transition:background var(--t-fast)}
.ti:hover{background:var(--raised)}
.ti.on{background:var(--raised);box-shadow:0 0 0 1px var(--line),var(--hi)}
.ti>div{min-width:0}
.ti .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.ti .m{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color var(--t)}
.ti .m.ask{color:var(--ask)}
.ti .tools{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;gap:2px;padding-left:30px;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,var(--raised) 24px);transition:opacity var(--t-fast)}
.ti:hover .tools,.ti:focus-within .tools{pointer-events:auto}
.ti:hover .tools,.ti:focus-within .tools{opacity:1}
.mini{width:24px;height:24px;display:grid;place-items:center;border-radius:7px;color:var(--text-3)}
.mini:hover{background:var(--raised-2);color:var(--text)}
.mini svg{width:14px;height:14px}
.ring{width:16px;height:16px;margin-top:2px}
.ring circle{fill:none;stroke-width:2}
.ring .bg{stroke:var(--line-2)} .ring .fg{stroke:var(--live);stroke-linecap:round;transition:stroke-dashoffset var(--t-slow) var(--ease)}
.ring.ask .fg{stroke:var(--ask)} .ring.paused .fg{stroke:var(--text-3)}
.ring.spin{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.q{grid-template-columns:18px 1fr;align-items:center;padding:7px 8px}
.q>.grip,.q>.pos{grid-row:1;grid-column:1;transition:opacity var(--t-fast)}
.q>div{grid-row:1;grid-column:2}
.q .grip{color:var(--text-2);cursor:grab;opacity:0;display:grid;place-items:center}
.q:hover .grip{opacity:1}
.q:hover .pos{opacity:0}
.q .grip svg{width:13px;height:13px}
.q .pos{font-family:var(--mono);font-size:11px;color:var(--text-3);text-align:center}
.q.drag{opacity:.4}
.q.over{box-shadow:inset 0 2px 0 var(--live)}
.addq{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;margin-top:2px;border-radius:var(--r);color:var(--text-3);font-size:13px;width:100%}
.addq:hover{color:var(--text);background:var(--raised)}
.addq svg{width:14px;height:14px}
.doneline{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r);font-size:12.5px;color:var(--text-3);cursor:pointer}
.doneline:hover{background:var(--raised);color:var(--text-2)}
.doneline svg{width:14px;height:14px;color:var(--good)}
.doneline .chev{margin-left:auto;color:var(--text-3)}

.ctrl{border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:12px}
.ctrl .lbl{font-size:11.5px;color:var(--text-3);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.ctrl .lbl b{font-family:var(--mono);font-weight:500;color:var(--text-2)}
.level{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:var(--r);background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);margin-top:6px}
.level button{position:relative;z-index:1;height:28px;font-size:12.5px;color:var(--text-3);border-radius:8px;transition:color var(--t)}
.level button.on{color:var(--text)}
.level .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:8px;background:var(--raised-2);box-shadow:0 0 0 1px var(--line-2),var(--hi),0 2px 6px rgba(0,0,0,.25);transition:transform var(--t-slow) var(--spring)}
.level-d{font-size:12px;color:var(--text-2);margin-top:8px;line-height:1.45;min-height:35px}
.budget{height:4px;border-radius:2px;background:var(--line-2);overflow:hidden;margin-top:7px}
.budget i{display:block;height:100%;border-radius:2px;background:var(--text-2);transition:width .6s var(--ease-out)}
.row-sw{display:flex;align-items:center;justify-content:space-between;font-size:13px}
.row-sw .s{font-size:11.5px;color:var(--text-3);display:block}
.kill{display:flex;align-items:center;justify-content:center;gap:8px;height:38px;border-radius:var(--r);font-weight:500;font-size:13.5px;color:var(--text);background:var(--raised-2);box-shadow:0 0 0 1px var(--line-2),var(--hi);transition:all var(--t) var(--ease)}
.kill:hover{box-shadow:0 0 0 1px var(--bad),0 0 0 4px var(--bad-soft);color:var(--bad)}
.kill kbd{margin-left:4px}
.kill.resume{background:var(--live);color:var(--btn-text);box-shadow:none}
.kill.resume:hover{box-shadow:0 0 0 4px var(--live-soft);color:var(--btn-text)}
.kill.resume kbd{color:inherit;border-color:currentColor;opacity:.6}
.me{display:flex;align-items:center;gap:10px;padding:2px 4px;font-size:13px;color:var(--text-2)}
.av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#3a3d45,#24262b);display:grid;place-items:center;font-size:11px;font-weight:600;color:#cfd2d8}
[data-theme="light"] .av{background:linear-gradient(135deg,#dcdcd8,#c8c8c3);color:#3c3e44}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--text-2);transition:background var(--t-fast),color var(--t-fast)}
.iconbtn:hover{background:var(--raised-2);color:var(--text)}

.sw{width:32px;height:20px;border-radius:10px;background:var(--line-3);position:relative;transition:background var(--t) var(--ease);flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform var(--t-slow) var(--spring)}
.sw.on{background:var(--live)} .sw.on::after{transform:translateX(12px)}

.main{margin:10px 10px 10px 0;background:var(--panel);border-radius:var(--r-xl);box-shadow:0 0 0 1px var(--line),var(--hi);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.top{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 14px;border-bottom:1px solid var(--line);position:relative;z-index:5}
.tabs-nav{position:relative;display:flex;gap:2px;padding:4px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.tabs-nav a{position:relative;z-index:1;display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:9px;font-size:13px;color:var(--text-3);cursor:pointer;white-space:nowrap;transition:color var(--t)}
.tabs-nav a:hover{color:var(--text)}
.tabs-nav a.on{color:var(--text)}
.tabs-nav a svg{width:15px;height:15px}
.tabs-nav a .n{font-family:var(--mono);font-size:10.5px;min-width:17px;height:17px;padding:0 4px;border-radius:5px;display:grid;place-items:center;background:var(--ask-soft);color:var(--ask)}
.tabs-nav .ind{position:absolute;top:4px;bottom:4px;left:0;border-radius:9px;background:var(--raised-2);box-shadow:0 0 0 1px var(--line-2),var(--hi),0 2px 8px rgba(0,0,0,.25);transition:transform var(--t-slow) var(--spring),width var(--t-slow) var(--spring)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:var(--r-sm);color:var(--text-2);font-size:12.5px;white-space:nowrap;transition:background var(--t-fast),color var(--t-fast),box-shadow var(--t-fast)}
button.chip:hover,button.chip.open{background:var(--raised-2);color:var(--text)}
.chip svg{width:14px;height:14px}
.chip .chev{width:12px;height:12px;opacity:.6}
.chip.out{box-shadow:0 0 0 1px var(--line)}
.searchbtn{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 12px;border-radius:10px;color:var(--text-3);background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;transition:all var(--t-fast)}
.searchbtn:hover{color:var(--text-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.meter{width:36px;height:4px;border-radius:2px;background:var(--line-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--text-2);border-radius:2px}
.view{flex:1;min-height:0;overflow:auto;position:relative}
.view.enter>*{animation:viewIn var(--t-slow) var(--ease-out)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pausebar{display:flex;align-items:center;gap:10px;padding:0 14px 0 18px;height:0;overflow:hidden;background:var(--raised);border-bottom:1px solid transparent;font-size:13px;color:var(--text-2);transition:height var(--t-slow) var(--ease-out),border-color var(--t)}
.pausebar.on{height:44px;border-color:var(--line)}
.pausebar svg{color:var(--text)}
.pausebar b{color:var(--text);font-weight:500}
.pausebar .btn{margin-left:auto}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 13px;border-radius:var(--r-sm);font-weight:500;font-size:13px;white-space:nowrap;transition:background var(--t-fast),box-shadow var(--t-fast),transform var(--t-fast),opacity var(--t-fast),color var(--t-fast)}
.btn:active{transform:scale(.96)}
.btn svg{width:14px;height:14px}
.btn.pri{background:var(--btn);color:var(--btn-text);box-shadow:var(--hi)}
.btn.pri:hover{opacity:.9}
.btn.sec{box-shadow:0 0 0 1px var(--line-2),var(--hi);background:var(--raised)}
.btn.sec:hover{background:var(--raised-2)}
.btn.ghost{color:var(--text-2)} .btn.ghost:hover{background:var(--raised-2);color:var(--text)}
.btn.ask{background:var(--ask);color:#1a1205}
[data-theme="light"] .btn.ask{color:#fff}
.btn.live{background:var(--live);color:var(--btn-text)}
.btn kbd{border-color:currentColor;opacity:.55;color:inherit}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.seg{display:inline-flex;padding:2px;border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px var(--line);gap:2px;background:var(--sunken)}
.seg button{height:24px;padding:0 8px;border-radius:6px;font-family:var(--mono);font-size:11.5px;color:var(--text-3)}
.seg button.on{background:var(--raised-2);color:var(--text);box-shadow:0 0 0 1px var(--line)}

/* ---------- popover ---------- */
.pop{position:fixed;z-index:70;min-width:240px;max-width:340px;padding:6px;border-radius:var(--r-md);background:var(--raised);box-shadow:var(--shadow-pop);animation:popIn var(--t) var(--ease-out) both;transform-origin:top left}
@keyframes popIn{from{opacity:0;transform:translateY(-4px) scale(.97)}}
.pop h6{font-size:11px;font-weight:500;color:var(--text-3);padding:6px 8px 4px;letter-spacing:.02em}
.pop .o{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:start;padding:8px;border-radius:8px;cursor:pointer}
.pop .o:hover,.pop .o.kb{background:var(--raised-2)}
.pop .o svg{color:var(--text-3);margin-top:2px}
.pop .o .t{font-size:13.5px}
.pop .o .d{font-size:12px;color:var(--text-3);line-height:1.4;margin-top:1px}
.pop .o .r{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-top:3px;white-space:nowrap}
.pop .o.sel .ck{color:var(--live)}

/* ---------- cards & spotlight ---------- */
.card{position:relative;background:var(--surface);background-color:var(--raised);border-radius:var(--r-lg);box-shadow:var(--shadow);isolation:isolate}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity var(--t-slow);background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),var(--spot),transparent 60%)}
.card:hover::before{opacity:1}

/* ---------- home ---------- */
.home{max-width:1080px;margin:0 auto;padding:36px 40px 72px}
.hello{display:block}
.hello .date{font-size:13px;color:var(--text-3)}
.hello h1{font-size:28px;font-weight:600;letter-spacing:-.03em;margin-top:6px;line-height:1.15}
.hello p{color:var(--text-2);margin-top:6px;font-size:15px}
.hello p b{color:var(--text);font-weight:500}
.stats{margin-left:auto;display:flex;gap:4px}
.stat{padding:10px 14px;border-radius:var(--r-md);min-width:96px;cursor:pointer;transition:background var(--t-fast)}
.stat:hover{background:var(--raised)}
.stat .v{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.stat .v i{width:7px;height:7px;border-radius:50%}
.stat .k{font-size:12px;color:var(--text-3)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.dot.ask{background:var(--ask)} .dot.live{background:var(--live)} .dot.good{background:var(--good)}

.composer{margin-top:28px;border-radius:var(--r-xl);transition:box-shadow var(--t) var(--ease)}
.composer.focus{box-shadow:var(--ring),var(--hi),0 24px 60px -24px rgba(0,0,0,.8)}
.modes{display:flex;gap:2px;padding:12px 12px 0}
.modes button{display:flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:8px;font-size:12.5px;color:var(--text-3);transition:all var(--t-fast)}
.modes button:hover{color:var(--text)}
.modes button.on{color:var(--text);background:var(--raised-2);box-shadow:0 0 0 1px var(--line)}
.modes button svg{width:14px;height:14px}
.composer textarea{display:block;width:100%;padding:12px 20px 4px;font-size:16px;line-height:1.5;min-height:56px}
.composer textarea::placeholder{color:var(--text-3)}
.composer .bar{display:flex;align-items:center;gap:2px;padding:8px 12px 12px}
.send{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--btn);color:var(--btn-text);transition:transform var(--t) var(--spring),opacity var(--t-fast)}
.send:not(:disabled):hover{transform:scale(1.06)}
.send:disabled{opacity:.2;cursor:default}
.send svg{stroke-width:2.25}
.before{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t-slow) var(--ease-out)}
.before.on{grid-template-rows:1fr}
.before>div{overflow:hidden}
.before .in{margin:0 12px 12px;padding:12px 14px;border-radius:var(--r-md);background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.before .k{font-size:11px;color:var(--text-3);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.before .k svg{width:12px;height:12px}
.before .v{font-size:13px;margin-top:3px;color:var(--text);line-height:1.4}
.before .v.flash{animation:flash .6s var(--ease-out)}
@keyframes flash{from{color:var(--live)}}
.sugg{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sugg button{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;color:var(--text-2);font-size:12.5px;box-shadow:inset 0 0 0 1px var(--line);transition:all var(--t-fast)}
.sugg button:hover{color:var(--text);background:var(--raised);box-shadow:inset 0 0 0 1px var(--line-2)}
.sugg svg{width:14px;height:14px;color:var(--text-3)}

.planrev{margin-top:16px;padding:16px;animation:stIn var(--t-slow) var(--ease-out) both}
.planrev .h{display:flex;align-items:center;gap:10px}
.planrev .h b{font-weight:600;font-size:15px}
.planrev .h .tag{margin-left:4px}
.planrev .sub{font-size:13px;color:var(--text-2);margin-top:4px}
.psteps{margin-top:12px;display:flex;flex-direction:column;gap:4px}
.ps{display:grid;grid-template-columns:14px 22px 1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r);background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);transition:opacity var(--t),background var(--t)}
.ps.off{opacity:.45} .ps.off .tt{text-decoration:line-through}
.ps .grip{color:var(--text-3);cursor:grab;display:grid;place-items:center} .ps .grip svg{width:13px;height:13px}
.ps .no{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.ps .tt{font-size:13.5px;outline:none;border-radius:4px}
.ps .tt:focus{box-shadow:0 0 0 1px var(--live-line);background:var(--raised)}
.ps .perm{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:5px;cursor:pointer;white-space:nowrap}
.ps .perm.look{color:var(--text-3);box-shadow:inset 0 0 0 1px var(--line-2)}
.ps .perm.ask{color:var(--ask);background:var(--ask-soft)}
.ps .perm.auto{color:var(--live);background:var(--live-soft)}
.ps.drag{opacity:.35} .ps.over{box-shadow:inset 0 2px 0 var(--live),inset 0 0 0 1px var(--line)}
.planrev .acts{display:flex;gap:8px;margin-top:14px;align-items:center}
.planrev .acts .faint{font-size:12px}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;margin-top:40px;align-items:start}
.col{display:flex;flex-direction:column;gap:32px;min-width:0}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-height:26px}
.sec-h h2{font-size:14px;font-weight:600;letter-spacing:-.005em}
.sec-h .c{font-family:var(--mono);font-size:11.5px;color:var(--text-3)}
.sec-h .c.ask{color:var(--ask)}
.sec-h .r{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3)}
.sec-h a{margin-left:auto;font-size:12.5px;color:var(--text-3);cursor:pointer;display:flex;align-items:center;gap:2px}
.sec-h a:hover{color:var(--text)}
.sec-h a svg{width:13px;height:13px}

/* decision stack */
.dstack{position:relative;padding-bottom:16px}
.dstack .back{position:absolute;left:0;right:0;bottom:0;height:60px;border-radius:var(--r-lg);background:var(--raised);box-shadow:0 0 0 1px var(--line);transition:all var(--t-slow) var(--ease-out)}
.dstack .back.b1{transform:scale(.965);bottom:8px;opacity:.8}
.dstack .back.b2{transform:scale(.93);bottom:0;opacity:.5}
.dcard{position:relative;z-index:2;padding:18px 18px 16px;transition:transform var(--t-slow) var(--ease-out),opacity var(--t-slow) var(--ease-out)}
.dcard.out-yes{transform:translate(40px,-8px) rotate(1.2deg);opacity:0}
.dcard.out-no{transform:translate(-40px,-8px) rotate(-1.2deg);opacity:0}
.dcard.in{animation:dIn var(--t-slow) var(--ease-out) both}
@keyframes dIn{from{transform:translateY(14px) scale(.97);opacity:.4}}
.dcard .src{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3)}
.dcard .src .tag{height:20px}
.dcard .tt{font-size:17px;font-weight:600;letter-spacing:-.015em;margin-top:8px}
.dcard .cmd{margin-top:12px;padding:10px 12px;border-radius:var(--r);background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);color:var(--text-2);font-family:var(--mono);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard .facts{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.dcard .fact{display:flex;gap:8px;font-size:12.5px;color:var(--text-2);line-height:1.4}
.dcard .fact svg{width:14px;height:14px;color:var(--text-3);margin-top:1px}
.dcard .det{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t-slow) var(--ease-out)}
.dcard .det.on{grid-template-rows:1fr}
.dcard .det>div{overflow:hidden}
.dcard .det ul{list-style:none;margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.dcard .det li{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--text-2)}
.dcard .det li span:last-child{color:var(--text-3)}
.dcard .acts{display:flex;align-items:center;gap:8px;margin-top:16px}
.dcard .acts .more{font-size:12.5px;color:var(--text-3);display:flex;align-items:center;gap:4px}
.dcard .acts .more:hover{color:var(--text)}
.dcard .acts .more svg{width:13px;height:13px;transition:transform var(--t)}
.dcard .acts .more.on svg{transform:rotate(180deg)}
.dnav{display:flex;gap:2px}
.allclear{padding:22px 18px;display:flex;gap:12px;align-items:center;color:var(--text-2);font-size:13.5px}
.allclear .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--good-soft);color:var(--good)}

/* running */
.stack{display:flex;flex-direction:column;gap:10px}
.live-card{padding:14px 16px;cursor:pointer;transition:transform var(--t) var(--ease),box-shadow var(--t)}
.live-card:hover{transform:translateY(-1px)}
.live-card .h{display:flex;align-items:center;gap:10px}
.live-card .tt{font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-card .el{margin-left:auto;color:var(--text-3);white-space:nowrap}
.live-card .tools{display:flex;gap:2px;margin-left:6px}
.strip{display:flex;align-items:center;margin:12px 0 10px}
.strip i{height:2px;flex:1;background:var(--line-2);position:relative;overflow:hidden}
.strip i.done{background:var(--text-3)}
.strip i.act::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--live),transparent);animation:sweep 1.4s linear infinite}
.paused-all .strip i.act::after,.paused-all .ring.spin,.paused-all .shimmer,.paused-all .caret::after,.paused-all .plan .p.act::after{animation-play-state:paused}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.node{width:10px;height:10px;flex:none;border:1.5px solid var(--text-3);border-radius:50%;background:var(--raised);transition:all var(--t) var(--ease)}
.node.sq{border-radius:2.5px}
.node.done{background:var(--text-3);border-color:var(--text-3)}
.node.done.look{background:var(--raised)}
.node.act{border-color:var(--live);background:var(--live);box-shadow:0 0 0 3px var(--live-soft)}
.node.ask{border-color:var(--ask);background:var(--ask);border-radius:2.5px;box-shadow:0 0 0 3px var(--ask-soft)}
.node.wait{opacity:.5}
.now{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);min-height:20px}
.caret::after{content:"";display:inline-block;width:6px;height:13px;background:var(--live);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite;border-radius:1px}
@keyframes blink{50%{opacity:0}}

/* changed today */
.chg{padding:4px 0}
.chg .r{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);transition:opacity var(--t)}
.chg .r:first-child{border-top:0}
.chg .r svg{width:14px;height:14px;color:var(--text-3)}
.chg .r .t{font-size:13px;line-height:1.35}
.chg .r .m{font-size:11.5px;color:var(--text-3);font-family:var(--mono);margin-top:1px}
.chg .r.undone .t{color:var(--text-3);text-decoration:line-through}
.chg .r .btn{height:26px;padding:0 9px;font-size:12px}
.chg .r.fresh{animation:fresh 1.6s var(--ease-out)}
@keyframes fresh{from{background:var(--live-soft)}}

.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;font-size:11.5px;font-family:var(--mono);background:var(--raised-2);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.tag svg{width:12px;height:12px}
.tag.good{background:var(--good-soft);color:var(--good);box-shadow:none}
.tag.bad{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.tag.ask{background:var(--ask-soft);color:var(--ask);box-shadow:none}
.tag.live{background:var(--live-soft);color:var(--live);box-shadow:none}

.score{padding:16px}
.score .lbl{font-size:12.5px;color:var(--text-2);display:flex;justify-content:space-between}
.score .big{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.score .big b{font-size:34px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score .big span{color:var(--text-3);font-size:14px}
.score .delta{color:var(--good);font-size:12px;font-family:var(--mono);margin-left:auto}
.chart{margin:10px -4px 0;height:72px;position:relative}
.chart svg{width:100%;height:100%;overflow:visible}
.chart .ln{fill:none;stroke:var(--text);stroke-width:1.5;stroke-linejoin:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.4s var(--ease-out) .2s forwards}
.chart .ar{fill:url(#ga);opacity:0;animation:fade .8s ease .9s forwards}
.chart .kp{fill:var(--good);opacity:0;animation:fade .3s ease 1.3s forwards}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .tip{position:absolute;top:-30px;transform:translateX(-50%);padding:3px 8px;border-radius:6px;background:var(--btn);color:var(--btn-text);font-size:11.5px;font-family:var(--mono);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity var(--t-fast),left var(--t) var(--ease-out)}
.chart .tip.on{opacity:1}
.chart .ax{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--text-3);margin-top:6px}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.tried{border-top:1px solid var(--line);margin-top:30px}
.tried div{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0 0;font-size:13px}
.tried div span{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc{padding:6px 16px}
.pc .r{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.pc .r:first-child{border-top:0}
.pc .r svg{color:var(--text-3)}
.pc .r .v{font-family:var(--mono);font-size:12px;color:var(--text-2)}
.pc .bar{grid-column:2/4;height:4px;border-radius:2px;background:var(--line-2);margin-top:-4px;overflow:hidden}
.pc .bar i{display:block;height:100%;border-radius:2px;background:var(--text-2);transform-origin:left;animation:grow 1s var(--ease-out) both .3s}
.pc .bar i.warn{background:var(--ask)}
@keyframes grow{from{transform:scaleX(0)}}
/* ---------- task ---------- */
.task{display:grid;grid-template-columns:minmax(0,1fr) 452px;height:100%;min-height:0}
.thread-wrap{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.thead{padding:20px 28px 14px;flex:none;border-bottom:1px solid var(--line)}
.thead .r1{display:flex;align-items:flex-start;gap:16px}
.thead h1{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.3}
.thead .ctl{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.thead .ctl .btn{height:28px}
.thead .meta{display:flex;gap:4px;margin:8px 0 0 -10px;flex-wrap:wrap;align-items:center}
.thead .meta .sp{flex:1}
.status{display:inline-flex;align-items:center;gap:7px;height:22px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:500;background:var(--live-soft);color:var(--live)}
.status.ask{background:var(--ask-soft);color:var(--ask)}
.status.done{background:var(--good-soft);color:var(--good)}
.status.paused{background:var(--raised-2);color:var(--text-2)}
.status .dot{margin:0;background:currentColor}
.plan{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:18px}
.plan .p{font-size:12px;color:var(--text-3);padding-top:8px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color var(--t)}
.plan .p::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;border-radius:2px;background:var(--line-2);transition:background var(--t)}
.plan .p.done{color:var(--text-2)} .plan .p.done::before{background:var(--text-3)}
.plan .p.act{color:var(--text)} .plan .p.act::before{background:var(--live-line)}
.plan .p.act::after{content:"";position:absolute;top:0;left:0;height:3px;width:40%;border-radius:2px;background:var(--live);animation:slide 1.6s var(--ease) infinite}
@keyframes slide{0%{left:-40%}100%{left:100%}}
.plan .p.ask{color:var(--ask)} .plan .p.ask::before{background:var(--ask)}
.plan .p .i{font-family:var(--mono);font-size:11px;margin-right:5px;opacity:.7}

.thread{flex:1;overflow:auto;padding:20px 28px 24px;scroll-behavior:smooth}
.st{position:relative;display:grid;grid-template-columns:44px 20px 1fr;gap:0 10px;padding-bottom:6px;animation:stIn var(--t-slow) var(--ease-out) both}
@keyframes stIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.st .tm{font-family:var(--mono);font-size:11.5px;color:var(--text-3);text-align:right;padding-top:5px}
.st .rail{position:relative;display:flex;justify-content:center;padding-top:8px}
.st .rail::after{content:"";position:absolute;top:24px;bottom:-4px;width:1px;background:var(--line-2)}
.st:last-child .rail::after{display:none}
.st .rail .node{position:relative;z-index:1}
.st .body{min-width:0;padding:2px 8px 10px;margin:0 -8px;border-radius:var(--r);cursor:pointer;transition:background var(--t-fast)}
.st .body:hover{background:var(--raised)}
.st.sel .body{background:var(--raised);box-shadow:0 0 0 1px var(--line)}
.st .ln1{display:flex;align-items:center;gap:8px;min-height:26px}
.st .ln1 .tt{font-size:14px}
.st .tool{font-family:var(--mono);font-size:11.5px;color:var(--text-3);margin-left:auto;white-space:nowrap}
.st .sub{font-size:13px;color:var(--text-2);margin-top:1px}
.st .sub .mono{font-size:12px}
.st .why{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:13px;color:var(--text-2)}
.st .why .tag{flex:none}
.st.think .body{cursor:default;background:none!important;box-shadow:none!important}
.st.think .txt{font-size:13.5px;color:var(--text-2);padding-top:3px;line-height:1.55}
.st.think .rail .node{width:6px;height:6px;border:0;background:var(--text-3);margin-top:2px;border-radius:50%}
.st .shimmer{background:linear-gradient(90deg,var(--text-2) 0%,var(--text) 40%,var(--text-2) 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.6s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
.st .stats{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}

.askbox{margin-top:8px;border-radius:var(--r-md);background:var(--raised);box-shadow:0 0 0 1px var(--ask-line),0 12px 32px -16px rgba(0,0,0,.5);padding:14px 16px;cursor:default;animation:askIn var(--t-slow) var(--ease-out) both}
@keyframes askIn{from{opacity:0;transform:translateY(6px) scale(.99)}to{opacity:1;transform:none}}
.askbox .q{font-size:15px;font-weight:500}
.askbox .cmd{margin-top:10px;padding:9px 12px;border-radius:var(--r-sm);background:var(--sunken);box-shadow:0 0 0 1px var(--line);font-family:var(--mono);font-size:12.5px}
.askbox .cmd .pr{color:var(--text-3);margin-right:8px;user-select:none}
.askbox dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin-top:12px;font-size:13px}
.askbox dt{color:var(--text-3)} .askbox dd{color:var(--text-2)}
.askbox .acts{display:flex;gap:8px;margin-top:14px;align-items:center}
.askbox .acts .sp{flex:1}
.askbox.answered{box-shadow:0 0 0 1px var(--line);opacity:.75}

.donebox{margin-top:8px;padding:14px 16px;border-radius:var(--r-md);background:var(--good-soft);cursor:default}
.donebox .q{font-weight:500;color:var(--good);display:flex;align-items:center;gap:8px}
.donebox p{color:var(--text-2);font-size:13px;margin-top:4px}
.donebox .learnt{display:flex;flex-direction:column;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--text-2)}
.donebox .learnt span{display:flex;gap:8px;align-items:center}
.donebox .learnt svg{width:14px;height:14px;color:var(--text-3)}
.donebox .acts{display:flex;gap:8px;margin-top:12px}

.steer{flex:none;padding:12px 28px 16px;border-top:1px solid var(--line)}
.steer .in{display:flex;align-items:center;gap:8px;height:42px;padding:0 6px 0 14px;border-radius:var(--r-md);background:var(--raised);box-shadow:0 0 0 1px var(--line)}
.steer .in:focus-within{box-shadow:0 0 0 1px var(--line-3)}
.steer input{flex:1;font-size:14px}
.steer input::placeholder{color:var(--text-3)}
.steer .hint{font-size:11.5px;color:var(--text-3);margin-top:6px;display:flex;gap:12px}

.insp{display:flex;flex-direction:column;min-height:0;background:var(--sunken)}
[data-theme="light"] .insp{background:#F6F6F4}
.tabs{display:flex;align-items:center;gap:2px;padding:10px 12px 0;border-bottom:1px solid var(--line);flex:none}
.tabs>button{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;font-size:13px;color:var(--text-3);position:relative;border-radius:6px 6px 0 0}
.tabs>button:hover{color:var(--text)}
.tabs>button.on{color:var(--text)}
.tabs>button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--text)}
.tabs>button svg{width:14px;height:14px}
.tabs>button .live-dot{width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 1.8s infinite}
.tabs .sp{flex:1}
.follow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);padding:0 2px 7px;white-space:nowrap}
.follow .sw{transform:scale(.85)}
.pane{flex:1;overflow:auto;min-height:0}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--text-3);font-size:13px;padding:24px}
.empty svg{width:22px;height:22px;margin-bottom:8px;stroke-width:1.5}

.file-h{display:flex;align-items:center;gap:8px;padding:12px 16px 8px;position:sticky;top:0;background:inherit;z-index:1}
.insp .pane{background:var(--sunken)} [data-theme="light"] .insp .pane{background:#F6F6F4}
.file-h .mono{color:var(--text)}
.file-h .tag{margin-left:auto}
.file-h .btn{height:24px;padding:0 8px;font-size:12px}
.diff{font-family:var(--mono);font-size:12px;line-height:20px;margin:0 12px 16px;border-radius:var(--r);box-shadow:0 0 0 1px var(--line);background:var(--panel);overflow:hidden}
.diff .l{display:grid;grid-template-columns:34px 14px 1fr;white-space:pre-wrap;word-break:break-word}
.diff .l.nw{animation:lineIn .25s ease both}
@keyframes lineIn{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
.diff .l .no{color:var(--text-3);text-align:right;padding-right:8px;user-select:none;opacity:.7}
.diff .l .sg{color:var(--text-3);user-select:none}
.diff .l.a{background:var(--add-bg)} .diff .l.a .sg{color:var(--good)}
.diff .l.d{background:var(--del-bg)} .diff .l.d .sg{color:var(--bad)}
.diff .l.h{color:var(--text-3);background:var(--raised-2);padding:2px 0;white-space:nowrap}
.diff .l.h .cd{overflow:hidden;text-overflow:ellipsis}
.diff .l .cd{padding-right:10px}
.tk-k{color:#C792EA} .tk-s{color:#C3E88D} .tk-f{color:#82AAFF} .tk-c{color:var(--text-3);font-style:italic} .tk-n{color:#F78C6C}
[data-theme="light"] .tk-k{color:#8839C9} [data-theme="light"] .tk-s{color:#2E7D32} [data-theme="light"] .tk-f{color:#1F5FBF} [data-theme="light"] .tk-n{color:#B5520C}

.term{font-family:var(--mono);font-size:12px;line-height:19px;padding:12px 16px 16px;white-space:pre-wrap;color:var(--text-2)}
.term .cmdl{color:var(--text)} .term .cmdl::before{content:"$ ";color:var(--text-3)}
.term .p{color:var(--good)} .term .f{color:var(--bad)} .term .dim{color:var(--text-3)}
.term .sum{margin-top:6px;padding:6px 10px;border-radius:6px;display:inline-block}
.term .sum.f{background:var(--bad-soft)} .term .sum.p{background:var(--good-soft)}
.term .blk{margin-bottom:14px}

.browser{margin:12px;border-radius:var(--r);overflow:hidden;box-shadow:0 0 0 1px var(--line-2);background:var(--panel)}

  if (d.answer) return giveAnswer(d.answer);
  if (d.answerLate) return toast(ic('up') + 'The desktop app pushes the branch here.');
  if (d.level) return setLevel(+d.level);
  if (d.dnav) { const n = needsList().length; S.dIdx = (S.dIdx + +d.dnav + n) % n; return paintNeeds(); }
  if (d.mode) { S.mode = d.mode; $$('[data-mode]').forEach(b => b.classList.toggle('on', b === t)); const a = $('#ask'); a.placeholder = placeholderFor(); paintChips(); paintBefore(0); return a.focus(); }
  if (d.undo) { const c = S.changed.find(x => x.id === d.undo); c.undone = !c.undone; if (c.undone) { S.setup.undo = true; paintSetup(); } paintChanged(); return toast(ic(c.undone ? 'undo' : 'redo') + (c.undone ? `Undone: ${c.t}` : `Redone: ${c.t}`)); }
  if (d.qtop) { const i = S.queue.findIndex(q => q.id === d.qtop), [q] = S.queue.splice(i, 1); S.queue.unshift(q); paintQueue(); flashQueue(q.id); return toast(ic('up') + 'Moved to the top of the queue.', () => { S.queue.splice(S.queue.indexOf(q), 1); S.queue.splice(i, 0, q); paintQueue(); }); }
  if (d.qdel) { const i = S.queue.findIndex(q => q.id === d.qdel), [q] = S.queue.splice(i, 1); paintQueue(); return toast(ic('x') + 'Removed from the queue.', () => { S.queue.splice(i, 0, q); paintQueue(); }); }
  if (d.pperm) { const s = S.plan.steps.find(x => x.id === d.pperm); s.perm = { look: 'ask', ask: 'auto', auto: 'look' }[s.perm]; return paintPlan(); }
  if (d.pskip) { const s = S.plan.steps.find(x => x.id === d.pskip); s.on = !s.on; return paintPlan(); }
  if (d.pact) { const [x, id] = d.pact.split(':'); return problemAct(x, id); }
  if (d.awayto) return awayGo(d.awayto);
  if (d.xpause) { const x = S.extra.find(y => y.id === d.xpause); if (x) { x.paused = !x.paused; paintSide(); paintLives(); } return; }
  if (d.tab) { R.tab = d.tab; R.follow = false; R.sel = null; return paintInsp(); }
  if (d.sugg) { const a = $('#ask'); a.value = d.sugg; a.dispatchEvent(new Event('input')); return a.focus(); }
  if (d.sel) {
    const s = R.steps.find(x => x.id === d.sel); const prev = R.sel;
    R.sel = prev === s.id ? null : s.id; R.follow = !R.sel;
    if (s.pane && R.sel) R.tab = s.pane.tab;
    [prev, R.sel].forEach(id => { const el = id && mounted.get(id); if (el) el.classList.toggle('sel', R.sel === id); });
    return paintInsp();
  }
  const a = d.act;
  if (a === 'palette') palette();
  else if (a === 'new') newTask(true);
  else if (a === 'theme') toggleTheme();
  else if (a === 'away') toggleAway();
  else if (a === 'pause') togglePause();
  else if (a === 'pauseRename') { S.rename.paused = !S.rename.paused; paintSide(); paintLives(); }
  else if (a === 'killall') killAll();
  else if (a === 'stop') toast(ic('stop') + 'The desktop app stops the task here. Its changes stay undoable.');
  else if (a === 'github') toast(ic('ext') + 'The desktop app opens the branch on GitHub here.');
  else if (a === 'follow') { R.follow = !R.follow; if (R.follow) { const p = R.sel; R.sel = null; const el = p && mounted.get(p); if (el) el.classList.remove('sel'); } paintInsp(); }
  else if (a === 'undostep' || a === 'undoall') toast(ic('undo') + (a === 'undoall' ? '2 changes undone. Files restored to 0:00.' : 'Change undone.'), () => toast(ic('redo') + 'Redone.'));
  else if (a === 'awayClose') { const A = S.awayCard; S.awayCard = null; paintAwayCard(); toast(ic('check') + 'Summary dismissed.', () => { S.awayCard = A; paintAwayCard(); }); }
  else if (a === 'setupHide') { S.setup.hidden = true; paintSetup(); toast(ic('flag') + 'Getting started hidden. Open it again from Ctrl K.'); }
  else if (a === 'toProblems') { if (S.view !== 'home') go('home'); setTimeout(() => awayGo('problems'), 80); }
  else if (a === 'useLocal') { S.local = true; paintNet(); repaintRun(); toast(ic('pc') + 'Using the local model until the internet is back.', () => { S.local = false; paintNet(); repaintRun(); }); }
  else if (a === 'netRetry') toast(ic('wifioff') + 'Still offline. Checking again every 30 s.');
  else if (a === 'undoSince') { const o = undoSinceOptions(); if (o.length) pop(t, 'Undo everything since', o, null, v => confirmUndo(+v)); }
  else if (a === 'attach') toast(ic('clip') + 'The desktop app opens a file picker here.');
  else if (a === 'det') { const el = $('#det'); el.classList.toggle('on'); t.classList.toggle('on'); }
  else if (a === 'closePlan') { S.plan = null; $('#planBox').innerHTML = ''; }
  else if (a === 'addPlanStep') {
    const s = { id: 'p' + Date.now(), t: 'New step', perm: S.perm === 2 ? 'auto' : 'look', on: true }; S.plan.steps.push(s); paintPlan();
    const el = $(`[data-pst="${s.id}"]`); el.focus(); getSelection().selectAllChildren(el);
  }
  else if (a === 'startPlan') {
    const P = S.plan, n = P.steps.filter(s => s.on).length; S.plan = null; paintPlan();
    const ta = $('#ask'); ta.value = ''; ta.dispatchEvent(new Event('input'));
    startExtra(P.text); const x = S.extra.at(-1); x.t = P.text; x.planN = n; paintSide(); paintLives();
  }
});

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && e.shiftKey && k === 'p') { e.preventDefault(); return killAll(); }
  if (mod && k === 'k') { e.preventDefault(); return palette(); }
  if (mod && k === 'n') { e.preventDefault(); return newTask(false); }
  if (e.key === 'Escape') { if (popEl) return closePop(); if (S.plan && !$('.scrim')) { S.plan = null; return paintPlan(); } if (S.queueNext) { S.queueNext = false; paintChips(); paintBefore(); } }
  if (typing() || $('.scrim')) return;
  if (S.view === 'home' && needsList().length) {
    if (k === 'y') decide(true);
    if (k === 'n') decide(false);
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const n = needsList().length; S.dIdx = (S.dIdx + (e.key === 'ArrowRight' ? 1 : -1) + n) % n; paintNeeds(); }
  }
  if (S.view === 'task') {
    if (e.key === ' ') { e.preventDefault(); togglePause(); }
    if (R.ask && k === 'y') giveAnswer('yes');
    if (R.ask && k === 'n') giveAnswer('no');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const sel = R.steps.filter(s => s.kind === 'look' || s.kind === 'change'); if (!sel.length) return;
      let i = sel.findIndex(s => s.id === R.sel); i = e.key === 'ArrowDown' ? Math.min(i + 1, sel.length - 1) : Math.max(i - 1, 0);
      const prev = R.sel; R.sel = sel[i].id; R.follow = false; if (sel[i].pane) R.tab = sel[i].pane.tab;
      [prev, R.sel].forEach(id => { const el = id && mounted.get(id); if (el) el.classList.toggle('sel', R.sel === id); });
      mounted.get(R.sel).scrollIntoView({ block: 'nearest', behavior: 'smooth' }); paintInsp(); e.preventDefault();
    }
  }
});
// Soft light that follows the pointer on cards.
document.addEventListener('pointermove', e => { const c = e.target.closest && e.target.closest('.card'); if (!c) return; const r = c.getBoundingClientRect(); c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px'); }, { passive: true });
addEventListener('resize', closePop);

// Tasks started from Home run a short sample of five steps.
setInterval(() => {
  if (S.allPaused || R.frozen || blocked()) return;
  let changed = false;
  S.extra.slice().forEach(x => {
    if (x.paused) return; changed = true; bump(1, x.step + ' \u00b7 ' + x.t, x.id);
    x.p = Math.min(1, x.p + 0.025 * R.speed); x.step = XSTEPS[Math.min(4, Math.floor(x.p * 5))];
    if (x.p >= 1) {
      S.extra = S.extra.filter(y => y !== x); S.doneX = (S.doneX || 0) + 1;
      S.changed.unshift({ id: 'c' + x.id, t: x.t, m: 'just now', i: 'pencil', fresh: true }); paintChanged();
      toast(ic('check') + `Completed: ${esc(x.t)}`);
    }
  });
  if (changed) { paintSide(); if (S.view === 'home') paintLives(); }
}, 1000);

/* ---------- boot ---------- */
shell(); go(S.view);
dragList($('#qList'), '.q', 'q', (f, to) => { const a = S.queue, i = a.findIndex(q => q.id === f), j = a.findIndex(q => q.id === to); const [x] = a.splice(i, 1); a.splice(j, 0, x); paintQueue(); flashQueue(x.id); });
if (params.get('speed')) R.speed = +params.get('speed');
if (!S.first) runSim();
if (params.get('palette')) setTimeout(palette, 300);
if (params.get('paused')) setTimeout(killAll, 200);
if (hold) { const h = setInterval(() => { if (evN >= ff) { ff = 0; clearInterval(h); setTimeout(() => { R.frozen = true; }, +hold); } }, 5); }
})();

</script></body></html>
