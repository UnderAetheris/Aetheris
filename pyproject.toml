[project]
name = "aetheris"
version = "0.1.0"
description = "Aetheris agent system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=7.0", "ruff==0.16.10", "pre-commit>=3.7", "httpx>=0.27"]

[project.scripts]
aetheris = "aetheris.__main__:main"
aetheris-api = "aetheris.api.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aetheris"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set.  Never rely on ruff's default selection: it changes
# between releases and silently turns CI red (M0 audit: 476 findings appeared
# from a ruff upgrade alone).  Expand deliberately, one family per PR.
select = ["E4", "E7", "E9", "F", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
