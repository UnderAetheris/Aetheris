name: Windows canary

# Windows is the product's target OS.  This canary is deliberately NOT part of
# PR CI (ci.yml forbids continue-on-error).  It runs weekly and on demand so
# Windows-only breakage is visible.  Promote it into ci.yml as a blocking job
# once it is green for two consecutive weeks.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1'  # Mondays 03:30 UTC (09:00 IST)

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run pytest
        run: python -m pytest tests/ -q
